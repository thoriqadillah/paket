[package]
name = "paket"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "paket"
path = "src/main.rs"

[[bin]]
name = "kangpaket"
path = "src/bin/kangpaket.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "signal"] }
